name: Metaから数字を取る

on:
  schedule:
    - cron: '30 23 * * *'   # 毎朝 8:30（日本時間）
  workflow_dispatch:

permissions:
  contents: write

concurrency: update-data

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Metaから取って data.json を書き換える
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }},${{ secrets.META_AD_ACCOUNT_ID_2 }}
          META_API_VERSION: ${{ vars.META_API_VERSION }}
          META_LISTIN_ACTION: ${{ vars.META_LISTIN_ACTION }}
        run: python scripts/fetch_meta.py
      - name: 変わっていれば保存する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json creatives
          git diff --cached --quiet || git commit -m "数字を更新（Meta）"
          git push
