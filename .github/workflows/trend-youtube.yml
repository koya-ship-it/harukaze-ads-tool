name: YouTubeショートのトレンドを集める

on:
  schedule:
    - cron: '10 22 * * *'   # 毎朝 7:10（日本時間）。1日1回だけ（無料枠を守るため）
  workflow_dispatch:

permissions:
  contents: write

concurrency: update-data

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 探して trends_youtube.json に書く
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/fetch_youtube.py
      - name: 変わっていれば保存する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f trends_youtube.json ] && git add trends_youtube.json || true
          git diff --cached --quiet || git commit -m "トレンドを更新（YouTube）"
          git push
