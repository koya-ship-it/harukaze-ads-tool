<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="180x180" href="favicon-180.png?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
<link rel="apple-touch-icon" href="favicon-180.png?v=2">
<title>Harukaze広告ツール</title>
<style>
:root {
  --green: #06c755; --green-dark: #04a847; --green-soft: #e8f8ee;
  --ink: #1d2433; --ink-2: #4a5468; --ink-3: #8a93a6;
  --line: #e5e4df; --bg: #f4f4f1; --card: #ffffff;
  --side: #161b24; --side-2: #262d3a; --side-ink: #a9b1bf;
  --red: #e5484d; --red-soft: #fdecec; --orange: #f08c00; --orange-soft: #fff4e0; --blue: #2f6fed; --blue-soft: #eaf1ff;
  --radius: 8px;
  --grad: linear-gradient(90deg, #cfe5f7, #8dbdf0 30%, #f1a38c 62%, #f3be72 78%, #e2452c);
  font-family: "Hiragino Sans", "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink); font-size: 14px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); }
button { font: inherit; cursor: pointer; color: inherit; }
a { color: var(--blue); text-decoration: none; }
.num { font-variant-numeric: tabular-nums; }

/* レイアウト（マーケツールと同じ：墨色の左メニュー＋白い上バー＋5色の線） */
.app { display: grid; grid-template-columns: 208px 1fr; min-height: 100vh; }
.rail { background: var(--side); display: flex; flex-direction: column; padding: 10px 8px; gap: 2px; position: sticky; top: 0; height: 100vh; }
.rail-head { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 700; padding: 2px 2px 12px; font-size: 13.5px; }
.mark { position: relative; overflow: hidden; width: 38px; height: 38px; border-radius: 10px; background: #1d2433; border: 1px solid #2f3a4d; color: #fff; font-weight: 800; display: grid; place-items: center; font-size: 18px; flex: none; }
.mark::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 18%; background: var(--grad); }
.rail-item { display: flex; align-items: center; gap: 8px; padding: 9px 8px; border-radius: 5px; color: var(--side-ink); font-size: 13px; border: 0; background: none; text-align: left; width: 100%; }
.rail-item:hover { background: rgba(255,255,255,.05); color: #fff; }
.rail-item.on { background: var(--side-2); color: #fff; }
.rail-item.dim { opacity: .45; cursor: default; }
.rail-ico { width: 24px; height: 24px; display: grid; place-items: center; flex: none; }
.rail-ico svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.rail-sep { height: 1px; background: #2a3140; margin: 8px 4px; }
.rail-sub { padding-left: 20px; font-size: 12.5px; }
.rail-foot { margin-top: auto; font-size: 11px; color: #6f7a8c; padding: 8px; line-height: 1.6; }

.main { min-width: 0; }
.topbar { position: sticky; top: 0; z-index: 10; background: #fff; display: flex; align-items: center; gap: 12px; padding: 0 24px; height: 56px; }
.topbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--grad); }
.topbar h1 { font-size: 17px; margin: 0; white-space: nowrap; }
.toptabs { display: flex; gap: 2px; margin-left: 12px; height: 100%; }
.toptabs button { border: 0; background: none; padding: 0 12px; color: var(--ink-3); font-weight: 600; font-size: 13px; border-bottom: 2px solid transparent; white-space: nowrap; }
.toptabs button:hover { color: var(--ink); }
.toptabs button.on { color: var(--ink); border-color: var(--green); }
.spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
.seg button { border: 0; background: none; padding: 6px 11px; font-size: 12.5px; font-weight: 600; color: var(--ink-3); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--ink); color: #fff; }
select.sel { border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; background: #fff; font: inherit; font-size: 12.5px; font-weight: 600; }
.sample { font-size: 11px; font-weight: 700; color: var(--orange); background: var(--orange-soft); padding: 3px 8px; border-radius: 6px; white-space: nowrap; }

.page { padding: 20px 24px 60px; max-width: 1400px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
.card-h { padding: 13px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.card-h h2 { margin: 0; font-size: 14.5px; }
.card-h .sub { font-size: 12px; color: var(--ink-3); }
.card-b { padding: 16px; }
.btn { border: 1px solid var(--line); background: #fff; padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { background: #f8fafc; }
.btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
.link { border: 0; background: none; color: var(--blue); font-weight: 600; font-size: 12.5px; padding: 0; }

/* 数字カード */
.kpis { display: grid; grid-template-columns: 1.5fr repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
.kpi { padding: 16px; }
.kpi .l { color: var(--ink-3); font-size: 12px; }
.kpi .v { font-size: 26px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.kpi .v small { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-left: 2px; }
.kpi .s { font-size: 12px; color: var(--ink-2); margin-top: 4px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.kpi.hero { border-color: var(--green); background: linear-gradient(180deg, var(--green-soft), #fff 70%); }
.kpi.hero .v { font-size: 40px; color: var(--green-dark); }
.delta { font-weight: 700; font-size: 11.5px; padding: 1px 6px; border-radius: 5px; }
.delta.good { color: var(--green-dark); background: var(--green-soft); }
.delta.bad { color: var(--red); background: var(--red-soft); }
.goalbar { height: 6px; background: #e9eee9; border-radius: 99px; margin-top: 10px; overflow: hidden; }
.goalbar i { display: block; height: 100%; background: var(--green); border-radius: 99px; }

.grid2 { display: grid; grid-template-columns: 1.7fr 1fr; gap: 14px; margin-bottom: 14px; }
.chart { width: 100%; height: 250px; display: block; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); margin-left: auto; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.tip { position: fixed; pointer-events: none; background: var(--ink); color: #fff; font-size: 12px; padding: 7px 10px; border-radius: 7px; line-height: 1.6; z-index: 50; display: none; white-space: nowrap; }

/* ファネル */
.fn { display: grid; gap: 4px; }
.fn-row { display: grid; grid-template-columns: 78px 1fr; align-items: center; gap: 10px; }
.fn-row .n { font-size: 12px; color: var(--ink-2); }
.fn-bar { height: 34px; border-radius: 6px; background: var(--ink); color: #fff; display: flex; align-items: center; padding: 0 10px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 76px; font-size: 13px; }
.fn-row.last .fn-bar { background: var(--green); }
.fn-rate { font-size: 11.5px; color: var(--ink-3); padding: 1px 0 1px 88px; }
.fn-rate b { color: var(--ink); }

/* 状態チップ */
.st { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
.st.good { color: var(--green-dark); background: var(--green-soft); }
.st.mid { color: var(--orange); background: var(--orange-soft); }
.st.bad { color: var(--red); background: var(--red-soft); }

/* クリエイティブのサムネ（実物の画像が入る場所） */
.thumb { position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden; color: #fff; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; font-weight: 800; line-height: 1.3; }
.thumb .fmt { position: absolute; top: 8px; right: 8px; font-size: 10px; font-weight: 700; background: rgba(0,0,0,.45); padding: 2px 6px; border-radius: 4px; }
.thumb.s { width: 44px; height: 44px; padding: 0; font-size: 0; flex: none; }
.thumb.s .fmt { display: none; }

.toplist { display: grid; }
.toprow { display: grid; grid-template-columns: 22px 44px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 9px 16px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; width: 100%; }
.toprow:last-child { border-bottom: 0; }
.toprow:hover { background: #fafaf8; }
.toprow .rk { font-weight: 700; color: var(--ink-3); text-align: center; }
.toprow .nm { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toprow .mt { font-size: 11.5px; color: var(--ink-3); }
.toprow .big { font-weight: 700; font-size: 16px; text-align: right; }
.toprow .big small { font-size: 11px; color: var(--ink-3); font-weight: 600; display: block; }

.alert { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 13px; }
.alert:last-child { border-bottom: 0; }
.alert .why { color: var(--ink-3); font-size: 12px; }

/* ランキング */
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.toolbar .lbl { font-size: 12px; color: var(--ink-3); }
.rank { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 12px; }
.rc { padding: 0; text-align: left; overflow: hidden; display: block; width: 100%; }
.rc:hover { border-color: var(--ink-3); }
.rc .pad { padding: 10px 12px 12px; }
.rc .thumb { border-radius: 0; font-size: 17px; padding: 14px; }
.rc .rkbadge { position: absolute; top: 8px; left: 8px; background: #fff; color: var(--ink); font-size: 12px; font-weight: 800; border-radius: 6px; padding: 2px 8px; }
.rc .rkbadge.g { background: var(--green); color: #fff; }
.rc .nm { font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px; justify-content: space-between; }
.rc .nm span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rc .hero { display: flex; align-items: baseline; gap: 6px; margin-top: 8px; }
.rc .hero b { font-size: 26px; font-weight: 600; color: var(--green-dark); }
.rc .hero span { font-size: 11.5px; color: var(--ink-3); }
.rc .ms { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
.rc .ms div { font-size: 10.5px; color: var(--ink-3); }
.rc .ms b { display: block; font-size: 13px; color: var(--ink); font-weight: 600; }
.rc .lp { margin-top: 8px; font-size: 11.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
table.tb { width: 100%; border-collapse: collapse; font-size: 13px; }
.tb th { text-align: right; font-size: 11.5px; color: var(--ink-3); font-weight: 600; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tb th:nth-child(-n+2), .tb td:nth-child(-n+2) { text-align: left; }
.tb td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.tb tr:last-child td { border-bottom: 0; }
.tb tbody tr { cursor: pointer; }
.tb tbody tr:hover { background: #fafaf8; }
.tb .cn { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.tablewrap { overflow-x: auto; }

/* LP */
.lpgrid { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 14px; align-items: start; }
.lpitem { display: block; width: 100%; text-align: left; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--line); background: none; border-left: 3px solid transparent; }
.lpitem:last-child { border-bottom: 0; }
.lpitem:hover { background: #fafaf8; }
.lpitem.on { border-left-color: var(--green); background: var(--green-soft); }
.lpitem .nm { font-weight: 700; font-size: 13.5px; display: flex; gap: 6px; align-items: center; }
.lpitem .url { font-size: 11.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.lpitem .ms { display: flex; gap: 14px; margin-top: 8px; font-size: 11px; color: var(--ink-3); }
.lpitem .ms b { display: block; font-size: 15px; color: var(--ink); font-weight: 600; }
.tag { white-space: nowrap; flex: none; font-size: 10px; font-weight: 700; color: var(--blue); background: var(--blue-soft); padding: 1px 6px; border-radius: 4px; }
.win { border: 1px solid var(--line); border-radius: 10px; background: #fff; overflow: hidden; }
.win-bar { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: #efeeea; border-bottom: 1px solid var(--line); }
.dots { display: flex; gap: 6px; }
.dots i { width: 11px; height: 11px; border-radius: 50%; background: #d5d3cc; }
.win-url { flex: 1; min-width: 0; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.win { position: sticky; top: 72px; }
.win-body { height: calc(100vh - 192px); min-height: 480px; overflow: hidden; background: #dddcd6; display: flex; justify-content: center; }
.win-body.sp { padding: 18px 0; }
.lpframe { width: 100%; background: #fff; height: max-content; }
.lpframe img { display: block; width: 100%; height: auto; }
.lpitem { position: relative; padding-right: 96px !important; }
.lpitem .sw { position: absolute; right: 12px; top: 12px; width: 74px; height: 52px; border-radius: 5px; border: 1px solid var(--line); }
.win-body.sp .lpframe { width: 402px; border-radius: 26px; overflow: hidden; border: 6px solid var(--ink); height: 100%; }
.win-body .lpframe { height: 100%; }
.lpgroup { padding: 8px 14px; font-size: 12px; font-weight: 700; background: #f8f7f4; border-bottom: 1px solid var(--line); border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: baseline; }
.lpgroup:first-of-type { border-top: 0; }
.lpgroup span { font-weight: 500; font-size: 11px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.win-body iframe { width: 100%; height: 100%; border: 0; background: #fff; }
/* LPの仮表示（本番ではここに実物のLPが出る） */
.fake section { padding: 34px 28px; text-align: center; }
.fake .fv { color: #fff; padding: 54px 28px; }
.fake .fv p { margin: 0 0 10px; font-size: 13px; font-weight: 700; opacity: .9; }
.fake .fv h3 { margin: 0; font-size: 30px; line-height: 1.35; font-weight: 800; }
.win-body.sp .fake .fv h3 { font-size: 23px; }
.fake .cta { display: inline-block; margin-top: 22px; background: var(--green); color: #fff; font-weight: 800; padding: 13px 34px; border-radius: 99px; font-size: 15px; }
.fake h4 { margin: 0 0 16px; font-size: 18px; }
.fake .bx { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.win-body.sp .fake .bx { grid-template-columns: 1fr; }
.fake .bx div { background: var(--bg); border-radius: 8px; height: 96px; }
.fake .ln { height: 10px; background: #e9e8e3; border-radius: 99px; margin: 9px auto; }
.fake .alt { background: var(--bg); }
.fake .alt .bx div { background: #fff; }
.lpside { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.lpitem .ms { flex-wrap: wrap; row-gap: 6px; }

/* 詳細の引き出し */
.shade { position: fixed; inset: 0; background: rgba(22,27,36,.4); z-index: 40; display: none; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100vw); background: #fff; z-index: 41; transform: translateX(100%); transition: transform .2s; overflow-y: auto; border-left: 1px solid var(--line); }
.drawer.open { transform: none; }
.shade.open { display: block; }
.dr-h { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; z-index: 1; }
.dr-h h2 { margin: 0; font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-b { padding: 18px; display: grid; gap: 16px; }
.dr-top { display: grid; grid-template-columns: 150px 1fr; gap: 14px; }
.dr-top .thumb { font-size: 14px; }
.dr-cr { background: #f1f0ec; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; justify-content: center; }
.dr-cr img, .dr-cr video { display: block; max-width: 100%; max-height: 62vh; }
.dr-cr.none { padding: 22px 14px; font-size: 12px; color: var(--ink-3); }
.rc .adset { font-size: 11px; color: var(--ink-3); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.win-ttl { display: flex; align-items: center; gap: 8px; padding: 10px 14px; font-size: 14px; border-bottom: 1px solid var(--line); }
.win-ttl .sub { font-size: 11.5px; color: var(--ink-3); }
.toprow > span { min-width: 0; }
.toprow .nm, .toprow .mt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toprow .big { white-space: nowrap; flex: none; }
.toprow .big small { white-space: nowrap; }
.tr-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.tr-bar input { flex: 1; min-width: 180px; max-width: 320px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px; font: inherit; font-size: 13px; background: #fff; }
.chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 5px 12px; font-size: 12px; color: var(--ink-2); }
.chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.chip small { opacity: .6; margin-left: 4px; }
.trs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; align-items: start; }
.tr { border: 1px solid var(--line); border-radius: 8px; background: #fff; overflow: hidden; }
.tr-emb { background: #f1f0ec; }
.tr-emb iframe { display: block; width: 100%; border: 0; }
.tr-emb.ig iframe { height: 560px; } .tr-emb.tt iframe { height: 580px; } .tr-emb.yt iframe { aspect-ratio: 9 / 16; height: auto; } .tr-emb.yt.wide iframe { aspect-ratio: 16 / 9; }
.tr-link { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; padding: 26px 16px; font-size: 12px; color: var(--ink-3); }
.tr-b { padding: 11px 14px 13px; }
.tr-b .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
.tr-b .memo { font-size: 13px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
.tr-b .ft { display: flex; gap: 8px; align-items: center; margin-top: 8px; font-size: 11px; color: var(--ink-3); }
.tr-b .ft a { margin-left: auto; color: var(--blue); font-weight: 600; text-decoration: none; }
.tr-st { display: flex; gap: 14px; margin-bottom: 8px; font-size: 10.5px; color: var(--ink-3); }
.tr-st b { display: block; font-size: 16px; color: var(--ink); font-weight: 600; }
.tr-st span:first-child b { color: var(--green-dark); font-size: 19px; }
.ai { border: 1px solid #bfe8cf; background: var(--green-soft); border-radius: 8px; padding: 12px 14px; }
.ai-h b { display: block; font-size: 14px; } .ai-h span { font-size: 11.5px; color: var(--ink-2); }
.ai-a { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
.ai-ok { font-size: 12px; color: var(--green-dark); font-weight: 600; }
.ai textarea { width: 100%; height: 260px; margin-top: 10px; border: 1px solid var(--line); border-radius: 6px; padding: 10px; font: 12px/1.6 ui-monospace, Menlo, monospace; background: #fff; resize: vertical; }
.ai-n { font-size: 11px; color: var(--ink-3); margin-top: 8px; line-height: 1.6; }
.tr-empty { border: 1px dashed #cfcec8; border-radius: 8px; padding: 34px 20px; text-align: center; color: var(--ink-2); font-size: 13px; line-height: 1.9; }
#back { margin-right: 4px; white-space: nowrap; }
#calBtn { white-space: nowrap; font-variant-numeric: tabular-nums; }
#calBtn.on { border-color: var(--ink); background: var(--ink); color: #fff; }
#cal { position: absolute; right: 0; top: calc(100% + 8px); z-index: 30; width: 318px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px; box-shadow: 0 10px 30px rgba(20,25,35,.14); }
.cal-h { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.cal-h b { flex: 1; text-align: center; font-size: 14px; }
.cal-h button { border: 1px solid var(--line); background: #fff; border-radius: 6px; width: 28px; height: 28px; }
.cal-h button:disabled { opacity: .3; }
.cal-g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal-g span { text-align: center; font-size: 10.5px; color: var(--ink-3); padding: 2px 0; }
.cal-d { border: 1px solid transparent; background: #f6f5f1; border-radius: 6px; padding: 4px 0 3px; text-align: center; font-size: 12px; line-height: 1.25; min-height: 40px; }
.cal-d small { display: block; font-size: 10px; color: var(--green-dark); font-weight: 600; }
.cal-d:disabled { background: none; color: #c9c8c2; }
.cal-d.in { background: var(--green-soft); border-color: #bfe8cf; }
.cal-d.edge { background: var(--ink); color: #fff; border-color: var(--ink); } .cal-d.edge small { color: #9fe9bd; }
.cal-f { display: flex; align-items: center; gap: 8px; margin-top: 9px; font-size: 11px; color: var(--ink-3); }
.cal-f button { margin-left: auto; }
.rail-sec { font-size: 10.5px; color: #6f7a8c; padding: 14px 12px 4px; letter-spacing: .08em; }
.rail-item.sub { font-size: 12.5px; padding-left: 14px; }
.rail-item.sub .dot { width: 6px; height: 6px; border-radius: 50%; background: #55607a; flex: none; margin: 0 9px 0 5px; }
.rail-item.sub.on .dot { background: var(--green); }
.rail-item.sub span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pjs { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
.pj { text-align: left; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: #fff; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; width: 100%; overflow: hidden; }
.pjs { align-items: stretch; }
.pj-sp { margin-top: auto; }
.pj-f span { white-space: nowrap; }
.pj-x { display: flex; gap: 14px; padding: 2px 16px 8px; font-size: 11px; color: var(--ink-3); }
.pj-x b { color: var(--ink); font-size: 13px; font-weight: 600; margin-left: 4px; }
.ext { margin: 14px 0; }
.pj-f { flex-wrap: wrap; row-gap: 4px; }
.ext .mgrid { grid-template-columns: repeat(5, 1fr); padding: 14px 16px; }
.ext .mgrid b { font-size: 20px; }
.pj:hover { border-color: #c9c8c2; }
.pj-h { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.pj-h b { font-size: 15.5px; display: block; }
.pj-h span { font-size: 11.5px; color: var(--ink-3); display: block; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pj-m { display: grid; grid-template-columns: 1.1fr 1fr 1fr 1fr; gap: 10px; padding: 12px 16px 6px; }
.pj-m div { font-size: 11px; color: var(--ink-3); }
.pj-m b { display: block; font-size: 17px; color: var(--ink); font-weight: 600; margin-top: 1px; white-space: nowrap; }
.pj-m div:first-child b { font-size: 26px; color: var(--green-dark); }
.pj-sp { padding: 4px 16px 0; }
.pj-f { display: flex; align-items: center; gap: 6px; padding: 10px 16px 14px; font-size: 11.5px; color: var(--ink-3); }
.pj-f .thumb.s { width: 34px; height: 34px; border-radius: 5px; }
.pj-f .go { margin-left: auto; color: var(--blue); font-weight: 600; }
.pj-w { margin: 0 16px 10px; padding: 6px 9px; font-size: 11px; background: #fff6e5; color: #a45e00; border-radius: 6px; }
.lpstage { display: flex; align-items: center; gap: 7px; padding: 9px 14px 3px; font-size: 11px; font-weight: 700; color: var(--ink-2); }
.lpstage i { font-style: normal; width: 17px; height: 17px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 10px; display: grid; place-items: center; }
.lpi { display: flex; gap: 11px; align-items: flex-start; width: 100%; text-align: left; padding: 8px 14px 9px 11px; border: 0; border-left: 3px solid transparent; background: none; }
.lpi:hover { background: #fafaf8; }
.lpi.on { border-left-color: var(--green); background: var(--green-soft); }
.lpi .sw { flex: none; width: 76px; height: 52px; border-radius: 5px; border: 1px solid var(--line); }
.lpi .tx { flex: 1; min-width: 0; display: block; }
.lpi .nm { display: block; font-size: 13px; font-weight: 700; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lpi .url { display: block; font-size: 11px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
.lpi .ms { display: flex; gap: 12px; margin-top: 6px; font-size: 10.5px; color: var(--ink-3); }
.lpi .ms span { white-space: nowrap; }
.lpi .ms b { display: block; font-size: 14px; color: var(--ink); font-weight: 600; }
.lpi .ms.none { display: block; font-size: 11px; }
.lpside .card { padding-bottom: 6px; }
.tag.stage { background: #eef6ef; color: var(--green-dark); }
.lpitem .ms.note { display: block; font-size: 11.5px; color: var(--ink-3); }
.mgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mgrid div { border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font-size: 11px; color: var(--ink-3); }
.mgrid b { display: block; font-size: 16px; color: var(--ink); font-weight: 600; margin-top: 2px; }
.sec-t { font-size: 12px; font-weight: 700; color: var(--ink-2); margin-bottom: 6px; }
.lpmini { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.lpmini .sw { width: 64px; height: 44px; border-radius: 5px; flex: none; border: 1px solid var(--line); }

@media (max-width: 1100px) {
  .kpis { grid-template-columns: repeat(2, 1fr); } .kpi.hero { grid-column: 1 / -1; }
  .grid2, .lpgrid { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; } .rail { display: none; }
  .topbar { height: auto; flex-wrap: wrap; padding: 10px 16px 0; row-gap: 6px; }
  .toptabs { order: 9; width: 100%; margin: 0; height: 38px; overflow-x: auto; }
  .page { padding: 16px; } .win { position: static; } .win-body { height: 480px; }
  .dr-top { grid-template-columns: 110px 1fr; }
}
</style>
</head>

function enter(id) { S.proj = id; if (S.view === 'home') S.view = 'dash'; const ls = lpsNow(); const used = new Set(AD_DATA.creatives.filter(inCamp).map(c => c.lpId)); S.lp = (ls.find(l => used.has(l.id)) || ls[0] || AD_DATA.lps[0]).id; }
/* 期間は「最後の日（end）」と「日数（days）」で持つ。カレンダーで選んだ時は custom */
const LEN = () => AD_DATA.creatives[0] ? AD_DATA.creatives[0].daily.length : 0;
const endIx = () => S.end == null ? LEN() - 1 : S.end;
const win = prev => { const b = endIx() + 1 - (prev ? S.days : 0); return [Math.max(0, b - S.days), Math.max(0, b)]; };
const slice = (c, prev) => c.daily.slice(...win(prev));
const dateAt = i => AD_DATA.creatives[0].daily[i].date;
const rangeTxt = () => S.days === 1 ? md(dateAt(endIx())) : `${md(dateAt(Math.max(0, endIx() - S.days + 1)))}〜${md(dateAt(endIx()))}`;
const perLbl = () => S.custom ? rangeTxt() : S.days === 1 ? '今日' : `${S.days}日`;
const prevLbl = () => S.days === 1 ? '前日比' : `前の${S.days}日比`;

/* グラフに出す日の並び。選んだ期間が短い時は、前後が分かるよう14日分を出して選んだ日だけ濃くする */
const chartIx = () => { const b = endIx() + 1, n = Math.max(S.days, 14), a = Math.max(0, b - n), [sa, sb] = win(); return [...Array(b - a)].map((_, k) => ({ i: a + k, sel: a + k >= sa && a + k < sb })); };
/* カレンダー：日ごとのリストイン数を小さく出す。1日押すとその日、続けて別の日を押すと期間 */
function calHtml() {

  const ixOf = new Map([...Array(n)].map((_, i) => [+dateAt(i), i])), [sa, sb] = win();
  const dim = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate(), lead = m.getDay();
  const prevOk = m > new Date(first.getFullYear(), first.getMonth(), 1), nextOk = m < new Date(last.getFullYear(), last.getMonth(), 1);

  for (let d = 1; d <= dim; d++) { const i = ixOf.get(+new Date(m.getFullYear(), m.getMonth(), d));

    const v = cs.reduce((a, c) => a + c.daily[i].listin, 0), inn = i >= sa && i < sb, edge = inn && (i === sa || i === sb - 1);

  return `<div class="cal-h"><button data-calm="-1" ${prevOk ? '' : 'disabled'}>‹</button><b>${m.getFullYear()}年${m.getMonth() + 1}月</b><button data-calm="1" ${nextOk ? '' : 'disabled'}>›</button></div>

}

/* 画像・動画の場所は https のURLか、このフォルダからの相対パス（例 creatives/a01.jpg）だけ受け付ける */
const imgOk = u => /^https:\/\/[^\s'"<>]+$/.test(u || '') || /^[\w\-./%]+$/.test(u || '') && !/^\/|\.\./.test(u);

/* ---------- トレンド（伸びているクリエイティブの置き場） ----------
   trends.json に入っているURLを、公式の埋め込みで並べる。足す時は GitHub の「トレンドを足す」から。 */
const REPO = 'https://github.com/koya-ship-it/harukaze-ads-tool';

const T = { q: '', genre: '', kind: '', sort: 'views', src: '' };

function embedOf(u) {
  let m;
  if ((m = u.match(/^https:\/\/(?:www\.)?instagram\.com\/(?:[\w.]+\/)?(reel|reels|p|tv)\/([\w-]+)/))) return { site: 'Instagram', cls: 'ig', src: `https://www.instagram.com/${m[1] === 'p' ? 'p' : 'reel'}/${m[2]}/embed/` };
  if ((m = u.match(/^https:\/\/(?:www\.|m\.)?tiktok\.com\/@[\w.-]+\/video\/(\d+)/))) return { site: 'TikTok', cls: 'tt', src: `https://www.tiktok.com/embed/v2/${m[1]}` };
  if ((m = u.match(/^https:\/\/(?:www\.|m\.)?youtube\.com\/shorts\/([\w-]{6,})/))) return { site: 'YouTube', cls: 'yt', src: `https://www.youtube.com/embed/${m[1]}` };
  if ((m = u.match(/^https:\/\/(?:(?:www\.|m\.)?youtube\.com\/watch\?(?:.*&)?v=|youtu\.be\/)([\w-]{6,})/))) return { site: 'YouTube', cls: 'yt wide', src: `https://www.youtube.com/embed/${m[1]}` };
  if (/^https:\/\/(?:www\.)?facebook\.com\/ads\/library/.test(u)) return { site: 'Meta広告ライブラリ' };
  if (/^https:\/\/ads\.tiktok\.com\//.test(u)) return { site: 'TikTok Creative Center' };
  try { return { site: new URL(u).hostname.replace(/^www\./, '') }; } catch (e) { return { site: 'リンク' }; }
}
function viewTrend() {
  /* 自動で集めた分（Instagramの決めたアカウントのリール）と、手で足した分を一緒に並べる */

  const cnt = k => ALL.reduce((a, t) => { [].concat(t[k] || []).forEach(v => a[v] = (a[v] || 0) + 1); return a; }, {});
  const chips = (k, c) => Object.entries(c).map(([v, n]) => `<button class="chip ${T[k] === v ? 'on' : ''}" data-tk="${k}" data-tv="${esc(v)}">${esc(v)}<small>${n}</small></button>`).join('');

  const list = ALL.filter(t => (!T.genre || [].concat(t.genre || []).includes(T.genre)) && (!T.kind || t.kind === T.kind) && (!T.src || (T.src === 'auto') === !!t.auto) && (!q || [t.memo, t.url, t.kind, [].concat(t.genre || []).join(' '), t.username, t.addedBy].join(' ').toLowerCase().includes(q)))

  const bar = `<div class="tr-bar"><input id="trq" type="search" placeholder="メモ・アカウント・ジャンルで探す" value="${esc(T.q)}">${seg}<span class="spacer"></span><span class="lbl">${list.length} / ${ALL.length}件${AUTO.updatedAt ? ' ・ 自動取得 ' + esc(String(AUTO.updatedAt).slice(5, 16).replace('T', ' ').replace('-', '/')) : ''}</span>${add}</div>
    <div class="tr-bar">${chips('genre', cnt('genre'))}${chips('kind', cnt('kind'))}${TRENDS.length && (AUTO.items || []).length ? `<button class="chip ${T.src === 'auto' ? 'on' : ''}" data-tk="src" data-tv="auto">自動で集めた分</button><button class="chip ${T.src === 'man' ? 'on' : ''}" data-tk="src" data-tv="man">手で足した分</button>` : ''}</div>`;
  if (!ALL.length) return `<div class="tr-bar"><span class="spacer"></span>${add}</div><div class="tr-empty"><b>まだ1件も入っていません。</b><br>見ておきたいInstagramのアカウントを登録すると、そのリールが再生数の多い順にここへ自動で並びます。<br>今は、Instagramを読むための権限の追加と、アカウントの登録を待っている状態です。<br>見つけたものを手で足したい時は、右上の「＋ URLを足す」から入れられます。</div>`;

  const svg = $('#chart'); if (!svg) return;
  const cs = AD_DATA.creatives.filter(inCamp), ix = chartIx(), n = ix.length;
  const days = ix.map(o => ({ date: dateAt(o.i), sel: o.sel, ...derive(sum(cs.map(c => c.daily[o.i]))) }));
  const W = svg.clientWidth || 700, H = 250, L = 34, R = 50, T = 12, B = 26, pw = W - L - R, ph = H - T - B;
  const maxL = (Math.max(...days.map(d => d.listin)) || 1) * 1.15, maxC = Math.max(...days.filter(d => isFinite(d.cpa)).map(d => d.cpa), AD_DATA.targetCpa || 0, 1) * 1.2;
  const bw = pw / n, x = i => L + bw * i + bw / 2, yl = v => T + ph - v / maxL * ph, yc = v => T + ph - v / maxC * ph;
  const step = Math.ceil(n / 8);
  let h = '';
  for (let g = 0; g <= 4; g++) { const y = T + ph * g / 4; h += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="#eceae5"/><text x="${L - 6}" y="${y + 4}" text-anchor="end" font-size="10" fill="#8a93a6">${Math.round(maxL * (4 - g) / 4)}</text><text x="${W - R + 6}" y="${y + 4}" font-size="10" fill="#8a93a6">¥${Math.round(maxC * (4 - g) / 4 / 100) / 10}k</text>`; }
  if (hasT()) h += `<line x1="${L}" x2="${W - R}" y1="${yc(AD_DATA.targetCpa)}" y2="${yc(AD_DATA.targetCpa)}" stroke="#e5484d" stroke-dasharray="4 4"/><text x="${W - R - 4}" y="${yc(AD_DATA.targetCpa) - 5}" text-anchor="end" font-size="10" fill="#e5484d">目標 ${yen(AD_DATA.targetCpa)}</text>`;
  days.forEach((d, i) => {
    h += `<rect x="${x(i) - bw * .32}" y="${yl(d.listin)}" width="${bw * .64}" height="${T + ph - yl(d.listin)}" rx="3" fill="${d.sel ? '#06c755' : '#cfeeda'}"/>`;
    if (i % step === 0 || i === n - 1) h += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#8a93a6">${md(d.date)}</text>`;
  });
  const pts = days.map((d, i) => isFinite(d.cpa) ? `${x(i)},${yc(d.cpa)}` : null).filter(Boolean);
  h += `<polyline points="${pts.join(' ')}" fill="none" stroke="#1d2433" stroke-width="2" stroke-linejoin="round"/>`;
  days.forEach((d, i) => { if (isFinite(d.cpa)) h += `<circle cx="${x(i)}" cy="${yc(d.cpa)}" r="${n > 20 ? 2 : 3}" fill="#fff" stroke="#1d2433" stroke-width="2"/>`; });
  days.forEach((d, i) => h += `<rect class="hit" data-i="${i}" x="${L + bw * i}" y="${T}" width="${bw}" height="${ph}" fill="transparent"/>`);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.innerHTML = h;
  const tip = $('#tip');
  svg.onmousemove = e => { const i = e.target.dataset && e.target.dataset.i; if (i == null) { tip.style.display = 'none'; return; }
    const d = days[i]; tip.innerHTML = `<b>${md(d.date)}</b><br>リストイン ${int(d.listin)}件<br>1件の費用 ${cpaTxt(d)}<br>広告費 ${yen(d.spend)}`;
    tip.style.display = 'block'; tip.style.left = Math.min(e.clientX + 14, innerWidth - 190) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; };
  svg.onmouseleave = () => tip.style.display = 'none';
}

/* ---------- 改善案づくり：DesignNOW（Codex／Claude Code）に渡す依頼文を、この広告の実物と成績から組み立てる ---------- */
let BRIEF = '';
function briefFor(c) {
  const m = stat(c), lp = lpOf(c.lpId) || {}, proj = AD_DATA.projects.find(p => p.campaignIds.includes(c.campaignId));
  const peers = AD_DATA.creatives.filter(x => x.campaignId === c.campaignId), avg = derive(sum(peers.flatMap(x => slice(x))));
  const noCv = avg.listin < 5;  /* この導線は登録をMetaでほぼ計測できていない → クリックで比べる */
  const live = peers.map(x => ({ x, m: stat(x) })).filter(o => o.m.spend > 0).sort((a, b) => noCv ? b.m.ctr - a.m.ctr : b.m.listin - a.m.listin);
  const rk = live.findIndex(o => o.x.id === c.id) + 1, abs = u => { try { return new URL(u, location.href).href; } catch (e) { return u; } };
  const cmp = (v, a) => !a ? '' : v >= a * 1.1 ? '（導線の平均より高い）' : v <= a * .9 ? '（導線の平均より低い）' : '（導線の平均並み）';
  const hyp = [];
  if (avg.ctr && m.ctr <= avg.ctr * .9) hyp.push('クリック率が導線の平均より低い → 最初の一目で止まっていない可能性。掴みのコピーと、目に入る主役の絵を優先して変える。');
  if (!noCv && avg.ctr && m.ctr >= avg.ctr * 1.1 && avg.cvr && m.cvr <= avg.cvr * .9) hyp.push('クリックはされるが登録に進んでいない → 広告の約束とLPの中身がずれている可能性。LPの訴求に寄せたコピーを試す。');
  if (noCv && avg.ctr && m.ctr >= avg.ctr * 1.1) hyp.push('クリック率は導線の平均より高い → 掴みは効いている。今の掴みを残して、素材と世界観の違いでさらに伸びるかを見る。');
  if (!noCv && avg.cvr && m.cvr >= avg.cvr * 1.1) hyp.push('登録率は導線の平均より高い → 訴求は合っている。訴求は残して、見た目（素材・世界観）で表示とクリックを伸ばす。');
  if (!hyp.length) hyp.push('数字は導線の平均並み → どの軸が効くかまだ分からない。3つの軸を均等に試す。');
  const head = `■ 元の広告
- 名前：${c.name}
- 導線：${proj ? proj.name : ''}
- 種類：${c.format}
- 画像：${imgOk(c.imageUrl) ? abs(c.imageUrl) : '（未登録。実物を添付します）'}
- リンク先のLP：${lp.url || '（不明）'}

■ 成績（${recent()}）
- 広告費 ${yen(m.spend)}／表示 ${int(m.imp)}／クリック ${int(m.click)}
- クリック率 ${pct(m.ctr)}${cmp(m.ctr, avg.ctr)}
${noCv ? `- 登録数：この導線はMetaで登録を計測できていないので、クリック率で判断する
- 1クリックの費用 ${yen(m.cpc)}（導線の平均 ${yen(avg.cpc)}）
- 導線の中の順位：クリック率で ${rk || '—'}位／${live.length}本` : `- 登録率 ${pct(m.cvr, 1)}${cmp(m.cvr, avg.cvr)}
- リストイン ${int(m.listin)}件／1件の費用 ${cpaTxt(m)}（導線の平均 ${cpaTxt(avg)}）
- 導線の中の順位：リストイン数で ${rk || '—'}位／${live.length}本`}

■ 数字から見た仮説
${hyp.map(h => '- ' + h).join('\n')}
`;
  if (c.format === '動画') return `DesignNOWとして、次の動画広告の「編集の型」を読み取り、同じ型で新しい素材を編集できる指示書にしてください。

${head}
■ やってほしいこと
1. 添付した動画（この広告の実物）を見て、型を言葉にする。
   - 冒頭3秒の掴み（何を見せ、何と言っているか）
   - 構成（何秒ごとに何の場面か）と、カットのテンポ（1カットの平均秒数、切り替えの仕方）
   - テロップ（書体・太さ・色・縁取り・位置・出し方・1画面の文字数）
   - BGM（雰囲気・テンポ・音量の上げ下げ）と効果音（どこで何を鳴らすか）
   - CTA（いつ、どんな言葉と見た目で出すか）
2. それを「編集指示書」にまとめる（別の素材にそのまま当てはめられる粒度で）。
3. 私が新しい素材を渡したら、この指示書どおりに編集する。
4. あわせて、上の仮説をもとに、変えると良さそうな点を3つ提案する（冒頭／テロップ／CTAのどれを変えるかを分けて）。

※ 画像のURLはサムネイルです。動画の実物は、このあと添付します。`;
  return `DesignNOWのバナー機能で、次の広告バナーの改善案を5案作ってください。ABテストに出すための案です。

${head}
■ 進め方
1. 上の画像を読み取り、今のバナーを3つに分けて言葉にする。
   - コピー（何を約束しているか、掴みの一言、数字）
   - 素材（写真・イラスト・背景に何を使っているか）
   - 世界観（配色・書体・レイアウト・全体の雰囲気）
2. 次の5案を作る。1案で変えるのは1つの軸だけにする（どの軸が効いたか分かるようにするため）。
   - A案：コピーだけ変える（訴求の切り口を変える）
   - B案：コピーだけ変える（訴求は同じで、掴みの一言・数字・言い回しを変える）
   - C案：素材だけ変える（写真・イラスト・背景を変える。コピーと世界観はそのまま）
   - D案：世界観だけ変える（コピーと素材は同じで、配色・書体・レイアウトをガラッと変える）
   - E案：世界観だけ変える（D案とは逆の方向に振る）
3. サイズと比率は元と同じにする。日付・講師名・ロゴ・価格などの事実は変えない。LPの内容と食い違う約束は書かない。
4. 各案に「変えた点／狙い／確かめたい仮説」を1行ずつ付ける。ファイル名は「${c.name}_A」〜「_E」。
5. 最後に、5案と元のバナーを並べた比較の1枚を作る。`;
}

  $('#back').style.display = S.proj ? '' : 'none';
  $('#calBtn').textContent = '📅 ' + rangeTxt(); $('#calBtn').classList.toggle('on', !!S.custom);
  $('#cal').hidden = !S.calOpen; if (S.calOpen) $('#cal').innerHTML = calHtml();
  if (S.view === 'dash') {
    const x = ext(P()), px = ext(P(), true);
    if (x) { const m = derive(sum(AD_DATA.creatives.filter(inCamp).flatMap(c => slice(c))));
      $('.kpis').insertAdjacentHTML('afterend', `<div class="card ext"><div class="card-h"><h2>登録のあと</h2><span class="sub">${esc(P().extra.source)} ・ ${esc(P().extra.asOf)}時点</span></div>
        <div class="mgrid"><div>LINEリスト<b class="num">${int(x.line)}</b>${delta(x.line, px.line)}</div><div>個別予約<b class="num">${int(x.booking)}</b>${delta(x.booking, px.booking)}</div><div>成約<b class="num">${int(x.deals)}</b>${delta(x.deals, px.deals)}</div><div>売上（入金）<b class="num">${yen(x.paid)}</b>${delta(x.paid, px.paid)}</div><div>ROAS（入金÷広告費）<b class="num">${m.spend ? (x.paid / m.spend * 100).toFixed(0) + '%' : '—'}</b></div></div></div>`); }
    drawChart();
  }
}
document.addEventListener('click', e => {
  if (S.calOpen && !e.target.closest('#cal,#calBtn')) { S.calOpen = false; S.pick = null; $('#cal').hidden = true; }
  const t = e.target.closest('[data-brief],[data-cal],[data-calm],[data-calx],[data-day],[data-trend],[data-tk],[data-home],[data-proj],[data-go],[data-d],[data-sort],[data-mode],[data-cr],[data-lp],[data-dev],[data-close]');
  if (e.target.id === 'shade') return closeDrawer();
  if (!t) return;
  const d = t.dataset;
  if (d.brief) { const ta = $('#aiTxt'); ta.value = BRIEF;
    if (d.brief === 'show') { ta.hidden = !ta.hidden; return; }
    const done = ok => { $('#aiOk').textContent = ok ? 'コピーしました' : '下の文を選んでコピーしてください'; if (!ok) { ta.hidden = false; ta.select(); } };
    (navigator.clipboard ? navigator.clipboard.writeText(BRIEF).then(() => done(true), () => done(false)) : done(false)); return; }
  if ('close' in d) return closeDrawer();
  if (d.cr) return openDrawer(d.cr);
  if (d.trend) { S.proj = null; S.view = 'trend'; closeDrawer(); }
  if (d.tk) T[d.tk] = d.tk === 'sort' ? d.tv : T[d.tk] === d.tv ? '' : d.tv;
  if (d.home) { S.proj = null; S.view = 'home'; closeDrawer(); }
  if (d.proj) { enter(d.proj); closeDrawer(); }
  if (d.go) S.view = d.go;
  if (d.d) { S.days = +d.d; S.end = null; S.custom = false; S.calM = null; }
  if (d.cal) { S.calOpen = !S.calOpen; S.pick = null; S.calM = null; }
  if (d.calx) { S.calOpen = false; S.pick = null; }
  if (d.calm) { const m = S.calM || new Date(dateAt(endIx()).getFullYear(), dateAt(endIx()).getMonth(), 1); S.calM = new Date(m.getFullYear(), m.getMonth() + +d.calm, 1); }
  if (d.day != null) { const i = +d.day;
    if (S.pick != null && S.pick !== i) { const a = Math.min(S.pick, i), b = Math.max(S.pick, i); S.end = b; S.days = b - a + 1; S.pick = null; S.calOpen = false; }
    else { S.end = i; S.days = 1; S.pick = i; }
    S.custom = true; }
  if (d.sort) S.sort = d.sort;
  if (d.mode) S.mode = d.mode;
  if (d.dev) S.dev = d.dev;
  if (d.lp) { S.lp = d.lp; S.view = 'lp'; closeDrawer(); }
  render(); if (d.go || d.lp || d.home || d.proj) scrollTo(0, 0);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
document.addEventListener('input', e => { if (e.target.id !== 'trq') return; T.q = e.target.value; render(); const i = $('#trq'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); });
fetch('trends_auto.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(a => { if (a && Array.isArray(a.items)) { AUTO = a; if (S.view === 'trend') render(); } }).catch(() => {});
fetch('trends.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : []).then(a => { TRENDS = Array.isArray(a) ? a : []; if (S.view === 'trend') render(); }).catch(() => {});
addEventListener('resize', () => S.view === 'dash' && drawChart());
function boot() {
  ensureProjects(AD_DATA);
  S.lp = AD_DATA.lps[0].id;
  $('#railProj').innerHTML = AD_DATA.projects.map(p => `<button class="rail-item sub" data-proj="${esc(p.id)}"><span class="dot"></span><span class="t">${esc(p.name)}</span></button>`).join('');
  $('#updated').textContent = AD_DATA.updatedAt;
  if (AD_DATA.listinSource) $('#src').textContent = 'Metaから毎朝自動';
  if (AD_DATA.tokenExpiresAt) { const left = Math.ceil((new Date(AD_DATA.tokenExpiresAt) - new Date()) / 864e5); $('#tok').textContent = left >= 0 ? `トークン期限 あと${left}日` : 'トークンの期限切れ'; if (left < 10) $('#tok').style.color = '#ff8f8f'; }
  /* #rank や #lp、#lp-sp、#lp=lp2 を付けて開くと、その画面から始まる */
  location.hash.slice(1).split('-').forEach(h => { const [k, v] = h.split('='); if (k === 'p' && AD_DATA.projects.some(p => p.id === v)) enter(v); if (['dash', 'rank', 'lp'].includes(k)) S.view = k; if (k === 'trend') { S.proj = null; S.view = 'trend'; } if (k === 'sp') S.dev = 'sp'; if (k === 'lp' && lpOf(v)) S.lp = v; });
  render();
}
/* 同じ場所に data.json があればそれを使う。無い・読めない時は上の仮データで動く */
fetch('data.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : Promise.reject()).then(d => {
  if (!d.creatives || !d.creatives.length || !d.lps || !d.lps.length) throw 0;
  AD_DATA = normalize(d); const chip = $('.sample'); if (chip && !d.sample) chip.remove();
}).catch(() => {}).finally(boot);
</script>
